name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: unit and golden tests
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fuzz (short)
        # seeds come from testdata/; a crasher found here is saved under
        # testdata/fuzz/ and becomes a regular test case once committed
        run: |
          go test -run '^$' -fuzz '^FuzzPod$' -fuzztime 30s ./internal/diagnose
          go test -run '^$' -fuzz '^FuzzMarkdownEscape$' -fuzztime 20s ./internal/render

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o kubectl-why ./cmd/kubectl-why
      - uses: helm/kind-action@v1
        with:
          cluster_name: why
      - name: broken pods are explained correctly
        run: test/e2e/run.sh
      - name: works as a kubectl plugin
        run: |
          sudo install kubectl-why /usr/local/bin/
          kubectl plugin list | grep kubectl-why
          kubectl why pod/healthy -n why-e2e --no-color
      - name: cluster-wide report in the job summary
        run: |
          # the e2e namespace is full of broken pods on purpose, so exit 1 is expected
          kubectl why -A -o markdown >> "$GITHUB_STEP_SUMMARY" || test $? -eq 1
