# Pods that are broken on purpose, one per failure mode kubectl-why explains.
apiVersion: v1
kind: Namespace
metadata:
  name: why-e2e
---
apiVersion: v1
kind: Pod
metadata: {name: oom, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: python:3.12-alpine
      command: ["python", "-c", "x = bytearray(512 * 1024 * 1024); import time; time.sleep(60)"]
      resources: {limits: {memory: 64Mi}, requests: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: crash, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'connect: connection refused' > /dev/termination-log; exit 3"]
---
apiVersion: v1
kind: Pod
metadata: {name: badimage, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:0.0.0-this-tag-does-not-exist
---
apiVersion: v1
kind: Pod
metadata: {name: nosecret, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
---
apiVersion: v1
kind: Pod
metadata: {name: notready, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      readinessProbe:
        tcpSocket: {port: 8080}
        periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata: {name: pending, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: {requests: {cpu: "500"}}
---
apiVersion: v1
kind: Pod
metadata: {name: healthy, namespace: why-e2e}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: why-e2e}
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: busybox:1.0.0-this-tag-does-not-exist
